name: Build Windows executable

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pillow

      - name: Convert icon to .ico
        run: python -c "from PIL import Image; Image.open('imaratel.png').save('icon.ico', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

      - name: Build exe
        run: pyinstaller --name IMRATEL --onefile --windowed --icon=icon.ico main.py

      - uses: actions/upload-artifact@v4
        with:
          name: IMRATEL-windows-exe
          path: dist/IMRATEL.exe
